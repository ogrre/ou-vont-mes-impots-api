services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    init: true
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      pgsql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    image: nginx:1.27-alpine
    init: true
    ports:
      - "${DOCKER_WEB_PORT:-8080}:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/favicon.ico"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  pgsql:
    image: postgres:16-alpine
    init: true
    environment:
      POSTGRES_DB: "${DB_DATABASE:-ovmi}"
      POSTGRES_USER: "${DB_USERNAME:-ovmi}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-ovmi}"
    ports:
      - "127.0.0.1:${DOCKER_DB_PORT:-5432}:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgsql_data:
